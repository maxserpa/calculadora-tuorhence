<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Tuorhence</title>
<style>
  :root{ --line:#3b2a17; --frame:#6a4a24; --gold:#d9a441; --gold-l:#f0d58a; --text:#e9e0cf; --muted:#a79a82; }
  *{box-sizing:border-box}
  body{margin:0;background:#0b0805;color:var(--text);padding:16px;min-height:100vh;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  .wrap{max-width:600px;margin:0 auto}

  /* ---- palco com a imagem de fundo ---- */
  .stage{position:relative;width:100%;aspect-ratio:816/788;container-type:inline-size;
    user-select:none;-webkit-user-select:none}
  .stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .o{position:absolute;margin:0;padding:0;border:0;background:transparent;color:#fff;
    font-family:Verdana,"DejaVu Sans",sans-serif;font-weight:700;line-height:1;text-align:center;
    display:flex;align-items:center;justify-content:center;border-radius:3px}
  input.o,select.o{display:block;user-select:text;-webkit-user-select:text}
  input.o[type=number]{-moz-appearance:textfield;appearance:textfield}
  input.o::-webkit-outer-spin-button,input.o::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.o:focus,select.o:focus{outline:none;background:rgba(255,255,255,.09);
    box-shadow:inset 0 0 0 1px rgba(255,215,120,.75)}
  select.o{appearance:none;-webkit-appearance:none;cursor:pointer;text-align-last:center}
  select.o option{background:#1a120d;color:#fff;font-size:14px}
  .o.left{justify-content:flex-start;text-align:left}
  .o.right{justify-content:flex-end;text-align:right}
  .o.nome{text-align:left;padding-left:calc(33 / 816 * 100cqw);font-weight:600}
  .o.exp{padding-right:calc(15 / 816 * 100cqw);letter-spacing:.04em}
  .o.pts{color:#22dd44;padding-right:calc(5 / 816 * 100cqw)}
  .o.lbl{color:#3a2412;text-shadow:0 1px 0 rgba(255,235,190,.55);font-family:"Segoe UI",system-ui,Arial,sans-serif;font-weight:700;pointer-events:none}
  .o.orn{color:#e0b45a;font-family:Georgia,"Palatino Linotype",serif;font-weight:400;font-variant:small-caps;
    letter-spacing:.08em;text-shadow:0 0 8px rgba(0,0,0,.9),0 1px 0 #000;pointer-events:none}
  .o.hit{border-radius:0}

  /* ---- barras de vida / mana / fôlego ---- */
  .o.barra{border:1px solid #000;border-radius:3px;color:#fff;letter-spacing:.03em;
    text-shadow:0 1px 2px #000,0 0 3px rgba(0,0,0,.8);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.6)}
  .o.barra.vida{background:linear-gradient(180deg,#e04848 0%,#b01c1c 45%,#6e0f0f 100%)}
  .o.barra.mana{background:linear-gradient(180deg,#6a74f0 0%,#3a42b8 45%,#1f2470 100%)}
  .o.barra.folego{background:linear-gradient(180deg,#52c45e 0%,#2f8a3a 45%,#1a5524 100%)}

  /* ---- bônus ---- */
  .sec{margin-top:16px;border:2px solid var(--frame);border-radius:8px;background:linear-gradient(180deg,#17100a,#0e0a07);padding:16px 18px}
  h2{margin:0 0 12px;font-family:Georgia,"Palatino Linotype",serif;font-weight:400;font-size:1.15rem;letter-spacing:1px;color:var(--gold)}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:#15100b;border:1px solid var(--line);border-radius:6px}
  .bonus{padding:10px 12px 12px}
  .bonus h3{margin:0 0 6px;padding-bottom:4px;border-bottom:1px dotted #4a3319;font-family:Georgia,"Palatino Linotype",serif;
    font-weight:400;font-size:.85rem;color:var(--gold);letter-spacing:.5px}
  .bonus ul{list-style:none;margin:0;padding:0}
  .bonus li{font-size:.78rem;line-height:1.6;color:#d8cfbd}
  .bonus li b{color:#e0b45a;font-weight:600}

  /* ---- botão de print ---- */
  .acoes{display:flex;justify-content:center;margin-top:16px}
  #btnPrint{background:linear-gradient(180deg,#3a2a14,#1c130a);color:var(--gold-l);border:1px solid var(--frame);
    border-radius:6px;padding:10px 30px;font-family:Georgia,"Palatino Linotype",serif;font-size:1rem;letter-spacing:1px;
    cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.6)}
  #btnPrint:hover{border-color:var(--gold);color:#fff}
  #btnPrint:active{transform:translateY(1px)}
  #btnPrint:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---- toast ---- */
  #toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99;
    max-width:min(360px,calc(100vw - 32px))}
  .toast{background:#5c0f0f;border:1px solid #e04040;color:#ffd9d9;padding:10px 14px;border-radius:4px;
    box-shadow:0 4px 14px rgba(0,0,0,.7);font-size:.9rem;animation:in .25s ease}
  .toast.out{opacity:0;transform:translateX(20px);transition:.3s}
  @keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  @media(max-width:640px){.cards3{grid-template-columns:repeat(2,1fr)}.sec{padding:14px}}
  @media(max-width:400px){.cards3{grid-template-columns:1fr}}
</style>
</head>

  {attr:'agilidade', nome:'Agilidade', itens:[['Esquiva (Fís/Mag)',5,''],['Fôlego',4.3,''],['Vel. Movimento',0.1,'%']]},
  {attr:'destreza', nome:'Destreza', itens:[
    ['Acerto (Fís/Mag)',3,''],
    ['Tempo entre Atq',-0.1,'%'],
    ['Chance Status',0.1,'%','Sangramento, queimadura, lentidão e veneno'],
    ['Chance Violência',0.2,'%']]},
  {attr:'mente', nome:'Mente', itens:[['Dano Mágico',1,''],['Energia',4.9,'']]},
  {attr:'espirito', nome:'Espírito', itens:[['Energia',6.9,''],['Defesa Mágica',0.4,''],['Dano Magia (Área)',1,'']]},
];

/* ---------- Montagem dos campos sobre a imagem ---------- */
const stage = document.getElementById('stage');
function place(e, x0, y0, x1, y1, fs){
  e.style.left = (x0 / IMG_W * 100) + '%';
  e.style.top = (y0 / IMG_H * 100) + '%';
  e.style.width = ((x1 - x0) / IMG_W * 100) + '%';
  e.style.height = ((y1 - y0) / IMG_H * 100) + '%';
  if (fs) e.style.fontSize = `max(${(fs / IMG_W * 100).toFixed(3)}cqw, ${Math.min(fs, 10)}px)`;
}
function mk(tag, cls, rect, fs, props){
  const e = document.createElement(tag);
  e.className = 'o ' + cls;
  place(e, rect[0], rect[1], rect[2], rect[3], fs);
  if (props) Object.keys(props).forEach(k => { if (k === 'text') e.textContent = props[k]; else e[k] = props[k]; });
  stage.appendChild(e);
  return e;
}

mk('input','nome',[34,61,462,106],22,{id:'nome',type:'text',value:'Guerreiro de Tuohence',maxLength:40,title:'Nome do personagem'});
const barVida   = mk('div','barra vida',  [505,47,802,71],  15,{title:'Vida'});
const barMana   = mk('div','barra mana',  [505,74,802,98],  15,{title:'Mana'});
const barFolego = mk('div','barra folego',[505,101,802,125],15,{title:'Fôlego'});
mk('input','',[52,160,128,200],22,{id:'level',type:'number',min:1,max:299,value:1,title:'Level (1–299)'});
mk('div','lbl left',[135,160,195,200],15,{text:'Level'});
const resetEl = mk('select','',[197,160,273,200],22,{id:'reset',title:'Reset (0–20)'});
for (let i = 0; i <= 20; i++) resetEl.add(new Option(i, i));
mk('div','lbl left',[281,160,345,200],15,{text:'Reset'});
mk('div','lbl right',[300,160,498,200],15,{text:'Pontos de atributo'});
mk('div','lbl right',[300,367,498,407],15,{text:'Pontos de maestria'});
const ptsA = mk('div','pts right',[505,160,582,200],22,{title:'Pontos de atributo disponíveis'});
const ptsM = mk('div','pts right',[505,367,582,407],22,{title:'Pontos de maestria disponíveis'});

function fieldGroup(list, y0, y1, iconY0, iconY1){
  list.forEach(f => {
    mk('div','hit',[f.icon[0], iconY0, f.icon[1], iconY1],0,{title: f.desc ? `${f.nome} — ${f.desc}` : f.nome});
    if (f.ornament) mk('div','orn',[f.icon[0], iconY0, f.icon[1], iconY1],26,{text:f.nome});
    mk('input','',[f.x[0], y0, f.x[1], y1],15,{id:f.id,type:'number',inputMode:'numeric',min:f.base,value:f.base,
      title: f.desc ? `${f.nome} — ${f.desc}` : f.nome});
  });
}
fieldGroup(ATRIBUTOS, 303, 323, 207, 295);
fieldGroup(MAESTRIAS, 505, 525, 409, 497);

const statOut = STATUS.map(s => {
  mk('div','hit',[s.icon[0], 609, s.icon[1], 697],0,{title:s.nome});
  return mk('div','',[s.x[0], 705, s.x[1], 725],15,{title:s.nome});
});

/* ---------- Toast ---------- */
const $ = id => document.getElementById(id);
const levelEl = $('level');
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),300); }, 3500);
}

/* ---------- Helpers ---------- */
function getLevel(){
  let l = parseInt(levelEl.value, 10);
  if (isNaN(l)) l = 1;
  return Math.min(299, Math.max(1, l));
}
const getReset = () => parseInt(resetEl.value, 10) || 0;
/* Reset 0 começa com 30 de atributo e 15 de maestria.
   A partir do Reset 1 o início é 100 × reset (atributo) e 50 × reset (maestria); os 30/15 não entram.
   Em ambos os casos cada level acima do 1 soma +10 de atributo e +5 de maestria. */
const totalAttr = () => (getReset() === 0 ? 30 : 100*getReset()) + 10*(getLevel()-1);
const totalMast = () => (getReset() === 0 ? 15 : 50*getReset()) + 5*(getLevel()-1);
const val = f => { const v = parseInt($(f.id).value, 10); return isNaN(v) ? f.base : Math.max(f.base, v); };
const spent = list => list.reduce((s,f)=> s + (val(f) - f.base), 0);
const num = n => String(Math.round(Math.abs(n) * 100) / 100);

/* ---------- Validação ---------- */
function validateGroup(list, total, changedField, label){
  const others = list.filter(f => f !== changedField).reduce((s,f)=> s + (val(f)-f.base), 0);
  const maxVal = changedField.base + Math.max(0, total - others);
  const cur = parseInt($(changedField.id).value, 10);
  if (!isNaN(cur) && cur > maxVal){
    $(changedField.id).value = maxVal;
    toast(`Pontos de ${label} insuficientes! ${changedField.nome} foi limitado a ${maxVal}.`);
  }
}
function enforceTotals(){
  if (spent(ATRIBUTOS) > totalAttr()){
    ATRIBUTOS.forEach(f => $(f.id).value = f.base);
    toast('Level/Reset reduzido: atributos redefinidos por excesso de pontos.');
  }
  if (spent(MAESTRIAS) > totalMast()){
    MAESTRIAS.forEach(f => $(f.id).value = f.base);
    toast('Level/Reset reduzido: maestrias redefinidas por excesso de pontos.');
  }
}

/* ---------- Render ---------- */
function render(){
  ptsA.textContent = totalAttr() - spent(ATRIBUTOS);
  ptsM.textContent = totalMast() - spent(MAESTRIAS);

  const blocos = id => {
    const v = val(ATRIBUTOS.find(a => a.id === id));
    return USAR_BLOCOS_COMPLETOS ? Math.floor(v/10) : v/10;
  };

  bonusData = BONUS.map(b => {
    const k = blocos(b.attr);
    return {nome: b.nome, linhas: b.itens.map(([rot, v, un, dica]) => {
      const t = v * k;
      return {val: `${t < 0 ? '-' : '+'}${num(t)}${un}`, rot, dica};
    })};
  });
  $('bonus').innerHTML = bonusData.map(b =>
    `<div class="card bonus"><h3>${b.nome}</h3><ul>${b.linhas.map(l =>
      `<li${l.dica ? ` title="${l.dica}"` : ''}><b>${l.val}</b> ${l.rot}</li>`).join('')}</ul></div>`
  ).join('');

  const A = blocos('agilidade'), D = blocos('destreza'), E = blocos('espirito');

  /* Barras: base do level 1 + ganho por level + bônus dos pontos acima dos 10 iniciais.
     Com os atributos iniciais (10) o level 1 mostra 26/12/9, como no jogo. */
  const lv = getLevel() - 1;
  const dF = blocos('forca') - 1, dC = blocos('constituicao') - 1, dA = A - 1,
        dM = blocos('mente') - 1, dE = E - 1;
  const vida   = BASE_LVL1[0] + POR_LEVEL[0]*lv + 20*dC + 1*dF;
  const mana   = BASE_LVL1[1] + POR_LEVEL[1]*lv + 4.9*dM + 6.9*dE;
  const folego = BASE_LVL1[2] + POR_LEVEL[2]*lv + 4.1*dF + 4.3*dA;
  const barra = (el, v) => { const n = Math.floor(v + 1e-9); el.textContent = `${n} / ${n}`; };
  barra(barVida, vida); barra(barMana, mana); barra(barFolego, folego);
  const cb = val(MAESTRIAS[0]), esqf = val(MAESTRIAS[1]), ea = val(MAESTRIAS[2]);
  const finais = [3*D + cb, 5*A + esqf, 0, 3*D + ea, 5*A, 0.4*E];
  finais.forEach((v, i) => statOut[i].textContent = num(v));
}

/* ---------- Eventos ---------- */
function bindGroup(list, totalFn, label){
  list.forEach(f => {
    const el = $(f.id);
    el.addEventListener('input', () => { validateGroup(list, totalFn(), f, label); render(); });
    el.addEventListener('change', () => {
      let v = parseInt(el.value, 10);
      if (isNaN(v) || v < f.base) el.value = f.base;
      validateGroup(list, totalFn(), f, label);
      render();
    });
  });
}
bindGroup(ATRIBUTOS, totalAttr, 'atributo');
bindGroup(MAESTRIAS, totalMast, 'maestria');

levelEl.addEventListener('input', () => {
  const raw = parseInt(levelEl.value, 10);
  if (!isNaN(raw) && (raw > 299 || raw < 1)){
    levelEl.value = raw > 299 ? 299 : 1;
    toast('O level deve estar entre 1 e 299.');
  }
  enforceTotals(); render();
});
levelEl.addEventListener('change', () => { levelEl.value = getLevel(); enforceTotals(); render(); });
resetEl.addEventListener('change', () => { enforceTotals(); render(); });

/* ---------- Salvar print (PNG) ----------
   Desenha o quadro principal (no tamanho original da imagem) e os bônus em um canvas e baixa como PNG. */
const SANS = '"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';
const SERIF = 'Georgia, "Palatino Linotype", serif';
const BAR_CORES = {
  vida:   ['#e04848', '#b01c1c', '#6e0f0f'],
  mana:   ['#6a74f0', '#3a42b8', '#1f2470'],
  folego: ['#52c45e', '#2f8a3a', '#1a5524'],
};
function caminho(c, x, y, w, h, r){
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
}

function salvarPrint(){
  try{
    const stageRect = stage.getBoundingClientRect();
    const k = IMG_W / stageRect.width;            // px da tela -> px da imagem original
    const PAD = 16, GAP = 16, SP = 18, CG = 12, COLS = 3;

    // medidas do bloco de bônus
    const cardW = (IMG_W - 2*SP - (COLS-1)*CG) / COLS;
    const rows = [];
    for (let i = 0; i < bonusData.length; i += COLS) rows.push(bonusData.slice(i, i + COLS));
    const rowH = rows.map(r => 12 + 26 + Math.max(...r.map(b => b.linhas.length)) * 21 + 8);
    const secH = SP + 34 + rowH.reduce((s, h) => s + h, 0) + (rows.length - 1) * CG + SP;

    const W = IMG_W + 2*PAD, H = PAD + IMG_H + GAP + secH + PAD;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    c.fillStyle = '#0b0805'; c.fillRect(0, 0, W, H);
    c.drawImage(stage.querySelector('img'), PAD, PAD, IMG_W, IMG_H);

    // campos e textos sobre a imagem
    stage.querySelectorAll('.o').forEach(el => {
      const txt = el.tagName === 'INPUT' ? el.value
                : el.tagName === 'SELECT' ? el.options[el.selectedIndex].text
                : el.textContent;
      if (!txt) return;
      const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
      const x = PAD + (r.left - stageRect.left) * k, y = PAD + (r.top - stageRect.top) * k;
      const w = r.width * k, h = r.height * k;
      const fs = parseFloat(cs.fontSize) * k;

      if (el.classList.contains('barra')){
        const cor = BAR_CORES[['vida','mana','folego'].find(n => el.classList.contains(n))];
        const g = c.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, cor[0]); g.addColorStop(.45, cor[1]); g.addColorStop(1, cor[2]);
        caminho(c, x, y, w, h, 3*k); c.fillStyle = g; c.fill();
        c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x + 2*k, y + k, w - 4*k, k);
        caminho(c, x + .5, y + .5, w - 1, h - 1, 3*k); c.strokeStyle = '#000'; c.lineWidth = k; c.stroke();
      }

      c.font = `${cs.fontVariantCaps === 'small-caps' ? 'small-caps ' : ''}${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
      c.fillStyle = cs.color; c.textBaseline = 'middle';
      if ('letterSpacing' in c) c.letterSpacing = ((parseFloat(cs.letterSpacing) || 0) * k) + 'px';
      c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
      if (el.classList.contains('barra')){ c.shadowColor = 'rgba(0,0,0,.9)'; c.shadowBlur = 2*k; c.shadowOffsetY = k; }
      if (el.classList.contains('lbl'))  { c.shadowColor = 'rgba(255,235,190,.55)'; c.shadowOffsetY = k; }
      if (el.classList.contains('orn'))  { c.shadowColor = 'rgba(0,0,0,.9)'; c.shadowBlur = 8*k; c.shadowOffsetY = k; }

      const pl = parseFloat(cs.paddingLeft) * k, pr = parseFloat(cs.paddingRight) * k, al = cs.textAlign;
      let tx;
      if (al === 'left' || al === 'start'){ c.textAlign = 'left'; tx = x + pl; }
      else if (al === 'right' || al === 'end'){ c.textAlign = 'right'; tx = x + w - pr; }
      else { c.textAlign = 'center'; tx = x + (pl + w - pr) / 2; }
      c.fillText(txt, tx, y + h / 2 + fs * 0.04);
      if ('letterSpacing' in c) c.letterSpacing = '0px';
      c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    });

    // bloco de bônus
    const sy = PAD + IMG_H + GAP;
    const fundo = c.createLinearGradient(0, sy, 0, sy + secH);
    fundo.addColorStop(0, '#17100a'); fundo.addColorStop(1, '#0e0a07');
    caminho(c, PAD + 1, sy + 1, IMG_W - 2, secH - 2, 8); c.fillStyle = fundo; c.fill();
    c.strokeStyle = '#6a4a24'; c.lineWidth = 2; c.stroke();
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.font = `400 20px ${SERIF}`; c.fillStyle = '#d9a441';
    c.fillText('Bônus Adquiridos pelos Atributos', PAD + SP, sy + SP + 18);

    rows.forEach((linha, ri) => {
      const y0 = sy + SP + 34 + rowH.slice(0, ri).reduce((s, h) => s + h, 0) + ri * CG;
      linha.forEach((b, ci) => {
        const x0 = PAD + SP + ci * (cardW + CG);
        caminho(c, x0 + .5, y0 + .5, cardW - 1, rowH[ri] - 1, 6); c.fillStyle = '#15100b'; c.fill();
        c.strokeStyle = '#3b2a17'; c.lineWidth = 1; c.stroke();
        c.font = `400 16px ${SERIF}`; c.fillStyle = '#d9a441';
        c.fillText(b.nome, x0 + 12, y0 + 12 + 14);
        c.setLineDash([2, 3]); c.strokeStyle = '#4a3319';
        c.beginPath(); c.moveTo(x0 + 12, y0 + 12 + 20); c.lineTo(x0 + cardW - 12, y0 + 12 + 20); c.stroke();
        c.setLineDash([]);
        b.linhas.forEach((l, i) => {
          const ly = y0 + 12 + 26 + i * 21 + 15;
          c.font = `600 14.5px ${SANS}`; c.fillStyle = '#e0b45a';
          c.fillText(l.val, x0 + 12, ly);
          const vw = c.measureText(l.val).width;
          c.font = `400 14.5px ${SANS}`; c.fillStyle = '#d8cfbd';
          c.fillText(l.rot, x0 + 12 + vw + 6, ly);
        });
      });
    });

    cv.toBlob(blob => {
      if (!blob){ toast('Não foi possível gerar o print.'); return; }
      const nome = ($('nome').value || 'personagem').trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'personagem';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `tuorhence-${nome}-lvl${getLevel()}-r${getReset()}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      const btn = $('btnPrint'); btn.textContent = 'Print salvo!';
      setTimeout(() => { btn.textContent = 'Salvar print'; }, 1800);
    }, 'image/png');
  } catch (e){
    toast('Não foi possível gerar o print.');
  }
}
$('btnPrint').addEventListener('click', salvarPrint);

render();
</script>
